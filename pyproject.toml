[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boligmester"
version = "0.1.0"
description = "Terminal-first AI-native property buying assistant for the Danish housing market."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Boligmester contributors" }
]
dependencies = [
  "google-adk>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
  "setuptools>=68",
  "wheel",
]
browser = [
  "playwright>=1.0",
]
tui = [
  "textual>=0.70",
]

[project.scripts]
boligmester = "apartment_agents.__main__:main"
apartment-agents = "apartment_agents.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
